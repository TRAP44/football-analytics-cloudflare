name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/cleanup-merged-branches.yml"
      - ".github/workflows/repository-maintenance.yml"

permissions:
  contents: read

concurrency:
  # PRs share one key and may supersede older commits. Every main SHA gets its
  # own key so GitHub cannot replace a pending production gate with a newer push.
  group: quality-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # A synthetic pull_request.closed run exists only to cancel superseded PR work.
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    # This job executes PR-controlled npm/scripts. Keep it ephemeral for public-repo PR safety.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run security:dependencies
      - run: npm run security:scan
      - run: npm run security:privileged
      - run: npm run lint
      - run: npm run check
      - run: npm run verify:supabase
      - name: Run release-critical tests
        run: npm run test:release
      - run: node scripts/bottom-nav-render-smoke.js
      - run: npm run verify:release
      - run: npm run verify:worker


  database-integration:
    # Fork PR code and synthetic close/cancellation runs must never execute on the persistent WSL runner.
    # The full database gate still runs after merge on trusted main before production deploy.
    if: ${{ github.event_name != 'pull_request' || (github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    env:
      SUPABASE_CLI_VERSION: "2.119.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Validate database integration runtime
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          NPX_BIN="$(command -v npx)"
          [[ -n "$NODE_BIN" && -n "$NPX_BIN" ]]
          case "$NODE_BIN:$NPX_BIN" in
            *"/mnt/c/"*|*".exe"*|*".cmd"*)
              echo "Database integration requires native Linux Node/npm tooling on the WSL runner." >&2
              echo "node=$NODE_BIN npx=$NPX_BIN" >&2
              exit 1
              ;;
          esac
          docker info >/dev/null
          command -v psql >/dev/null

      - name: Verify pinned Supabase CLI
        run: |
          set -euo pipefail
          CLI_VERSION="$(npx --yes "supabase@$SUPABASE_CLI_VERSION" --version)"
          test "$CLI_VERSION" = "$SUPABASE_CLI_VERSION"

      - name: Fresh install migration and concurrency gate
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null

          FRESH_DIR="$RUNNER_TEMP/matchradar-supabase-fresh"
          rm -rf "$FRESH_DIR"
          mkdir -p "$FRESH_DIR"
          cd "$FRESH_DIR"

          npx --yes "supabase@$SUPABASE_CLI_VERSION" init
          node "$GITHUB_WORKSPACE/scripts/prepare-supabase-ci-migrations.js" \
            fresh "$FRESH_DIR/supabase/migrations" "$GITHUB_WORKSPACE"

          npx --yes "supabase@$SUPABASE_CLI_VERSION" start \
            --exclude rest,auth,realtime,storage,functions,studio,mail,analytics,pooler \
            --output-format json > "$RUNNER_TEMP/supabase-fresh-start.json"
          npx --yes "supabase@$SUPABASE_CLI_VERSION" db reset

          npx --yes "supabase@$SUPABASE_CLI_VERSION" status \
            -o env --output-format text > "$RUNNER_TEMP/supabase-fresh.env"
          set -a
          source "$RUNNER_TEMP/supabase-fresh.env"
          set +a

          FRESH_LEGACY_FP="$(node -p "require(process.env.GITHUB_WORKSPACE + '/release-contract.json').databaseContract.freshInstallLegacyFingerprint")"
          FRESH_V2_FP="$(node -p "require(process.env.GITHUB_WORKSPACE + '/release-contract.json').databaseContract.freshInstallFingerprint")"
          LATEST_MIGRATION_FILE="$(find "$FRESH_DIR/supabase/migrations" -maxdepth 1 -type f -name '*.sql' | sort | tail -n1)"
          LATEST_MIGRATION_VERSION="$(basename "$LATEST_MIGRATION_FILE" | cut -d_ -f1)"
          test -n "$LATEST_MIGRATION_VERSION"

          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c \
            "select public.backend_schema_fingerprint() as legacy_schema_contract, public.backend_schema_contract_v2() as schema_contract_v2;"
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 \
            -f "$GITHUB_WORKSPACE/scripts/schema-contract-v2-diagnostics.sql"

          psql "$DB_URL" -X -v ON_ERROR_STOP=1 \
            -v expected_legacy_fingerprint="$FRESH_LEGACY_FP" \
            -v expected_v2_fingerprint="$FRESH_V2_FP" \
            -v expected_latest_migration_version="$LATEST_MIGRATION_VERSION" \
            -f "$GITHUB_WORKSPACE/scripts/supabase-ci-contract.sql"
          node "$GITHUB_WORKSPACE/scripts/supabase-concurrency-gate.js"

          LEGACY_FP="$(psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c \
            "select public.backend_schema_fingerprint()->>'fingerprint';")"
          test "$LEGACY_FP" = "$FRESH_LEGACY_FP"

          CONTRACT_V2_FP="$(psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c \
            "select public.backend_schema_contract_v2()->>'fingerprint';")"
          test "$CONTRACT_V2_FP" = "$FRESH_V2_FP"

          if psql "$DB_URL" -X -v ON_ERROR_STOP=1 \
            -f "$GITHUB_WORKSPACE/supabase/baseline/supabase_baseline_v6_19.sql" \
            > "$RUNNER_TEMP/supabase-baseline-guard.log" 2>&1; then
            echo "Fresh-install baseline unexpectedly applied over an existing schema." >&2
            exit 1
          fi
          grep -q "Fresh-install baseline refused" \
            "$RUNNER_TEMP/supabase-baseline-guard.log"

      - name: Stop fresh Supabase stack
        if: always()
        shell: bash
        run: |
          FRESH_DIR="$RUNNER_TEMP/matchradar-supabase-fresh"
          if [[ -f "$FRESH_DIR/supabase/config.toml" ]]; then
            cd "$FRESH_DIR"
            npx --yes "supabase@$SUPABASE_CLI_VERSION" stop --no-backup || true
          fi

      - name: Upgrade previous schema through latest migration
        shell: bash
        run: |
          set -euo pipefail
          UPGRADE_DIR="$RUNNER_TEMP/matchradar-supabase-upgrade"
          rm -rf "$UPGRADE_DIR"
          mkdir -p "$UPGRADE_DIR"
          cd "$UPGRADE_DIR"

          npx --yes "supabase@$SUPABASE_CLI_VERSION" init
          node "$GITHUB_WORKSPACE/scripts/prepare-supabase-ci-migrations.js" \
            upgrade-base "$UPGRADE_DIR/supabase/migrations" "$GITHUB_WORKSPACE"

          npx --yes "supabase@$SUPABASE_CLI_VERSION" start \
            --exclude rest,auth,realtime,storage,functions,studio,mail,analytics,pooler \
            --output-format json > "$RUNNER_TEMP/supabase-upgrade-start.json"

          npx --yes "supabase@$SUPABASE_CLI_VERSION" status \
            -o env --output-format text > "$RUNNER_TEMP/supabase-upgrade.env"
          set -a
          source "$RUNNER_TEMP/supabase-upgrade.env"
          set +a

          FRESH_LEGACY_FP="$(node -p "require(process.env.GITHUB_WORKSPACE + '/release-contract.json').databaseContract.freshInstallLegacyFingerprint")"
          FRESH_V2_FP="$(node -p "require(process.env.GITHUB_WORKSPACE + '/release-contract.json').databaseContract.freshInstallFingerprint")"

          # upgrade-base includes every migration before latest. Prove an older Worker that
          # still requires the historical v1 fingerprint remains ready after the
          # new complete contract is present.
          PRE_LATEST_LEGACY_FP="$(psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c \
            "select public.backend_schema_fingerprint()->>'fingerprint';")"
          test "$PRE_LATEST_LEGACY_FP" = "$FRESH_LEGACY_FP"

          PRE_LATEST_V2="$(psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c \
            "select to_regprocedure('public.backend_schema_contract_v2()') is not null;")"
          test "$PRE_LATEST_V2" = "t"

          OLD_WORKER_READY="$(psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c \
            "select public.backend_readiness_contract('$FRESH_LEGACY_FP',5)->>'ok';")"
          test "$OLD_WORKER_READY" = "true"

          node "$GITHUB_WORKSPACE/scripts/prepare-supabase-ci-migrations.js" \
            latest-only "$UPGRADE_DIR/supabase/migrations" "$GITHUB_WORKSPACE"
          LATEST_MIGRATION_FILE="$(find "$UPGRADE_DIR/supabase/migrations" -maxdepth 1 -type f -name '*.sql' | sort | tail -n1)"
          LATEST_MIGRATION_VERSION="$(basename "$LATEST_MIGRATION_FILE" | cut -d_ -f1)"
          test -n "$LATEST_MIGRATION_VERSION"
          npx --yes "supabase@$SUPABASE_CLI_VERSION" migration up

          psql "$DB_URL" -X -v ON_ERROR_STOP=1 \
            -v expected_legacy_fingerprint="$FRESH_LEGACY_FP" \
            -v expected_v2_fingerprint="$FRESH_V2_FP" \
            -v expected_latest_migration_version="$LATEST_MIGRATION_VERSION" \
            -f "$GITHUB_WORKSPACE/scripts/supabase-ci-contract.sql"

          NEW_WORKER_READY="$(psql "$DB_URL" -X -A -t -v ON_ERROR_STOP=1 -c \
            "select public.backend_readiness_contract_v2('$FRESH_V2_FP',5)->>'ok';")"
          test "$NEW_WORKER_READY" = "true"

          npx --yes "supabase@$SUPABASE_CLI_VERSION" migration up

      - name: Stop upgrade Supabase stack
        if: always()
        shell: bash
        run: |
          UPGRADE_DIR="$RUNNER_TEMP/matchradar-supabase-upgrade"
          if [[ -f "$UPGRADE_DIR/supabase/config.toml" ]]; then
            cd "$UPGRADE_DIR"
            npx --yes "supabase@$SUPABASE_CLI_VERSION" stop --no-backup || true
          fi
