name: Audit Infrastructure Capacity

on:
  workflow_dispatch:
    inputs:
      inspect_database:
        description: Read bounded Supabase server statistics and aggregate logs without changing data
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: infrastructure-capacity-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Checkout main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Read existing infrastructure configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DIAGNOSTICS_ENABLED: ${{ inputs.inspect_database == true && 'true' || 'false' }}
        run: node scripts/audit-infrastructure-capacity.js
      - name: Publish sanitized observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: infrastructure-capacity-audit
          path: load-results/infrastructure-capacity.json
          retention-days: 7
          if-no-files-found: warn
