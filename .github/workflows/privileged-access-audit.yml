name: Privileged Access Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/privileged-access-audit.js"
      - "scripts/security-history-scan.js"
      - "scripts/security-scan.js"
      - "wrangler.jsonc"
      - ".gitignore"
      - ".env.example"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/privileged-access-audit.js"
      - "scripts/security-history-scan.js"
      - "scripts/security-scan.js"
      - "wrangler.jsonc"
      - ".gitignore"
      - ".env.example"
  schedule:
    - cron: "47 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privileged-access-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'closed' }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit workflow privileges and public secret boundaries
        run: node scripts/privileged-access-audit.js

      - name: Audit reachable git history for secret evidence
        run: node scripts/security-history-scan.js
