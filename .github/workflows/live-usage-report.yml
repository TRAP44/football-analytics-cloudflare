name: Observe Live Usage

on:
  workflow_dispatch:
    inputs:
      include_product_report:
        description: Aggregate weekly product usage and returns without personal data in artifacts
        type: boolean
        default: false
      inspect_summary:
        description: Inspect up to six shared public LIVE summaries
        type: boolean
        default: false
      inspect_crest:
        description: Inspect the reported public FARDU badge
        type: boolean
        default: false
      inspect_watch:
        description: Read official YouTube source metadata and public fixture cache without publishing
        type: boolean
        default: false

      watch_publisher:
        description: Official publisher to inspect; used only when inspect_watch is true
        type: choice
        options:
          - fifa
          - sgpremierleague
        default: fifa
      watch_fixture_id:
        description: Optional positive fixture ID for one read-only API-Football identity check
        type: string
        default: ''
      watch_candidate_handle:
        description: Optional public YouTube handle for bounded research only, without @; never approves a source
        type: string
        default: ''
      watch_search_country:
        description: Explicit YouTube search territory; does not prove playback or broadcasting rights
        type: choice
        options:
          - RU
          - GB
          - US
          - SG
        default: RU

permissions:
  contents: read

concurrency:
  group: live-usage-report
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: background-jobs
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Read aggregate observations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/live-usage-report.js
      - name: Read weekly product aggregates
        if: inputs.include_product_report == true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/weekly-product-report.js
      - name: Inspect reported public team crest
        if: inputs.inspect_crest == true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/inspect-team-crest.js
      - name: Inspect shared public LIVE summaries
        if: inputs.inspect_summary == true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/inspect-live-summary.js
      - name: Verify official watch source metadata
        if: ${{ !cancelled() && inputs.inspect_watch == true }}
        env:
          MATCH_WATCH_PUBLISHER: ${{ inputs.watch_publisher || 'fifa' }}
          MATCH_WATCH_CANDIDATE_HANDLE: ${{ inputs.watch_candidate_handle }}
          MATCH_WATCH_SEARCH_COUNTRY: ${{ inputs.watch_search_country || 'RU' }}
          MATCH_WATCH_FIXTURE_ID: ${{ inputs.watch_fixture_id }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/inspect-match-watch.js
      - name: Save sanitized observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-usage-report
          path: |
            load-results/live-usage.json
            load-results/live-usage.md
            load-results/product-usage.json
            load-results/product-usage.md
            load-results/team-crest-*
            load-results/live-summary-inspection.json
            load-results/match-watch-source-check.json
          retention-days: 3
          if-no-files-found: error
