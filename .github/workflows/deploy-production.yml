name: Deploy Production

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      RELEASE_VERSION: "6.115.0-rc139"
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: RC110 guard against stale production deploy / RC111 verify deployment provenance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          VERIFIED_SHA="$(git rev-parse HEAD)"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "### RC112 manual production deploy guard" >> "$GITHUB_STEP_SUMMARY"
            echo "Manual deploy is allowed only for the current main revision and will be fully re-verified." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ "$DEPLOY_SHA" != "$VERIFIED_SHA" ]]; then
            echo "### Production provenance check failed" >> "$GITHUB_STEP_SUMMARY"
            echo "DEPLOY_SHA $DEPLOY_SHA does not match checked-out revision $VERIFIED_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$DEPLOY_SHA" != "$CURRENT_MAIN_SHA" ]]; then
            echo "### Stale production deploy blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Verified revision $DEPLOY_SHA is no longer current main ($CURRENT_MAIN_SHA)." >> "$GITHUB_STEP_SUMMARY"
            echo "A newer Quality run must deploy the current main revision." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### Production revision confirmed" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy SHA matches current main: $DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked-out SHA and current main both match deploy SHA: $DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "RC112 manual deploy target confirmed as current main: $DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Re-verify release artifact
        run: |
          npm run security:scan
          npm run check
          npm test
          npm run verify:release
          npm run verify:worker

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "### Cloudflare deploy blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required in the production environment or repository secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.1"
          command: deploy --keep-vars --message "release=${{ env.RELEASE_VERSION }} sha=${{ env.DEPLOY_SHA }}"

      - name: RC120 verify active production release identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYMENT_STATUS_JSON="$RUNNER_TEMP/production-deployment-status.json"
          VERSIONS_JSON="$RUNNER_TEMP/production-versions.json"
          verified=false
          for attempt in 1 2 3 4 5; do
            if npx wrangler deployments status --json > "$DEPLOYMENT_STATUS_JSON" \
              && npx wrangler versions list --json > "$VERSIONS_JSON" \
              && node scripts/verify-production-release-postcondition.js "$DEPLOYMENT_STATUS_JSON" "$VERSIONS_JSON" "$RELEASE_VERSION" "$DEPLOY_SHA"; then
              verified=true
              break
            fi
            if [[ "$attempt" -lt 5 ]]; then
              sleep 3
            fi
          done
          if [[ "$verified" != "true" ]]; then
            echo "Cloudflare did not confirm the expected production release identity." >&2
            exit 1
          fi
          echo "### RC120 active production release identity verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare control plane confirms release $RELEASE_VERSION for deploy SHA $DEPLOY_SHA at 100% traffic." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          CONFIGURED_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        shell: bash
        run: |
          SMOKE_URL="${CONFIGURED_URL:-$DEPLOYMENT_URL}"
          node scripts/post-deploy-smoke.js "$SMOKE_URL" "${{ env.RELEASE_VERSION }}"
          echo "### Cloudflare deploy verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Release ${{ env.RELEASE_VERSION }} post-deploy smoke passed for the production Worker." >> "$GITHUB_STEP_SUMMARY"
