name: Deploy Production

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Re-verify release artifact
        run: |
          npm run check
          npm test
          npm run verify:release
          npm run verify:worker

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "### Cloudflare deploy blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required in the production environment or repository secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.1"
          command: deploy --keep-vars --message "RC26 ${{ env.DEPLOY_SHA }}"

      - name: Verify production deployment
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          CONFIGURED_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        shell: bash
        run: |
          SMOKE_URL="${CONFIGURED_URL:-$DEPLOYMENT_URL}"
          node scripts/post-deploy-smoke.js "$SMOKE_URL" "6.18.0-rc26"
          echo "### Cloudflare deploy verified" >> "$GITHUB_STEP_SUMMARY"
          echo "RC26 post-deploy smoke passed for the production Worker." >> "$GITHUB_STEP_SUMMARY"
