name: External Production Monitor

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]
    branches: [main]
  schedule:
    # Four checks per hour, intentionally offset from the Worker's */5 cron.
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: external-production-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Primary availability observation stays outside the self-hosted CI/deploy
    # failure domain. A separate self-hosted diagnostic workflow only runs
    # after this workflow itself fails.
    timeout-minutes: 5
    env:
      PRODUCTION_URL: "https://football-analytics-cloudflare.wok-side.workers.dev"
      EXTERNAL_MONITOR_RETRIES: "3"
      EXTERNAL_MONITOR_RETRY_DELAY_MS: "10000"
      EXTERNAL_MONITOR_TIMEOUT_MS: "10000"
      EXTERNAL_MONITOR_READY_WARNING_MS: "3000"
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check production from external runner
        id: monitor
        continue-on-error: true
        run: node scripts/external-production-monitor.js

      - name: Store monitor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-production-monitor-${{ github.run_id }}
          path: |
            monitor-result.json
            monitor-result.md
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Reconcile availability incidents
        if: always() && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure')
        env:
          MONITOR_OUTCOME: ${{ steps.monitor.outcome }}
        run: node scripts/external-monitor-control-plane.js primary

      - name: Fail workflow when production is unavailable
        if: always() && steps.monitor.outcome == 'failure'
        run: |
          echo "External production monitor failed after all retries." >&2
          exit 1
