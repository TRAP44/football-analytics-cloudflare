name: Cleanup merged branches
# Safe stale-branch cleanup trigger

on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: cleanup-merged-branches
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete safe stale branches
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${GH_REPO%%/*}"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          deleted=0
          skipped=0

          while IFS=$'\t' read -r branch sha protected; do
            [[ -z "$branch" ]] && continue

            if [[ "$branch" == "$DEFAULT_BRANCH" || "$protected" == "true" ]]; then
              skipped=$((skipped + 1))
              continue
            fi

            case "$branch" in
              main|master|develop|development|production|staging)
                skipped=$((skipped + 1))
                continue
                ;;
            esac

            open_prs="$(gh api -X GET "repos/$GH_REPO/pulls" \
              -f state=open \
              -f head="$OWNER:$branch" \
              -f per_page=1 \
              --jq 'length')"

            if [[ "$open_prs" != "0" ]]; then
              echo "Keep open-PR branch: $branch"
              skipped=$((skipped + 1))
              continue
            fi

            encoded_branch="$(jq -nr --arg v "$branch" '$v|@uri')"
            safe_to_delete=false

            closed_match="$(gh api --paginate -X GET "repos/$GH_REPO/pulls" \
              -f state=closed \
              -f head="$OWNER:$branch" \
              -f per_page=100 \
              --jq '.[] | [.head.sha, (.merged_at // ""), .number] | @tsv' \
              | awk -F $'\t' -v current_sha="$sha" '$1 == current_sha { print; exit }')"

            if [[ -n "$closed_match" ]]; then
              safe_to_delete=true
            else
              ahead_by="$(gh api "repos/$GH_REPO/compare/$DEFAULT_BRANCH...$encoded_branch" --jq '.ahead_by' 2>/dev/null || echo unknown)"
              if [[ "$ahead_by" == "0" ]]; then
                safe_to_delete=true
              fi
            fi

            if [[ "$safe_to_delete" != "true" ]]; then
              echo "Keep branch with unique/unverified commits: $branch"
              skipped=$((skipped + 1))
              continue
            fi

            if gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$encoded_branch" >/dev/null 2>&1; then
              echo "Deleted safe stale branch: $branch"
              deleted=$((deleted + 1))
            else
              echo "Skipped branch that GitHub refused to delete: $branch"
              skipped=$((skipped + 1))
            fi
          done < <(
            gh api --paginate "repos/$GH_REPO/branches?per_page=100" \
              --jq '.[] | [.name, .commit.sha, .protected] | @tsv'
          )

          echo "Cleanup complete: deleted=$deleted skipped=$skipped"
