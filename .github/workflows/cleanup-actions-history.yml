name: Cleanup Actions history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-actions-history.yml"
  schedule:
    - cron: "19 4 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions-history
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CURRENT_RUN_ID: ${{ github.run_id }}
    steps:
      - name: Delete stale completed workflow runs
        shell: bash
        run: |
          set -euo pipefail

          now="$(date -u +%s)"
          deleted=0
          kept=0

          gh api --paginate "repos/$GH_REPO/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.id, (.head_branch // ""), .created_at, .name, (.conclusion // "")] | @tsv' |
          while IFS=$'\t' read -r run_id branch created_at workflow_name conclusion; do
            [[ -z "$run_id" ]] && continue

            if [[ "$run_id" == "$CURRENT_RUN_ID" || -z "$branch" ]]; then
              kept=$((kept + 1))
              continue
            fi

            created_epoch="$(date -u -d "$created_at" +%s)"
            age_days=$(( (now - created_epoch) / 86400 ))
            delete_run=false

            if [[ "$branch" != "main" ]]; then
              encoded_branch="$(jq -nr --arg v "$branch" '$v|@uri')"
              if ! gh api "repos/$GH_REPO/git/ref/heads/$encoded_branch" >/dev/null 2>&1 && (( age_days >= 1 )); then
                delete_run=true
              fi
            fi

            if [[ "$branch" == "main" ]]; then
              if [[ "$conclusion" == "cancelled" || "$conclusion" == "skipped" ]]; then
                (( age_days >= 1 )) && delete_run=true
              elif [[ "$conclusion" == "failure" ]]; then
                (( age_days >= 14 )) && delete_run=true
              else
                case "$workflow_name" in
                  "Backup Supabase"|"Deploy Production"|"Rollback Production")
                    (( age_days >= 30 )) && delete_run=true
                    ;;
                  "Quality"|"CodeQL Security"|"Privileged Access Audit")
                    (( age_days >= 7 )) && delete_run=true
                    ;;
                  "External Production Monitor"|"Cleanup merged branches"|"Cleanup Actions history"|"Cleanup Actions artifacts")
                    (( age_days >= 3 )) && delete_run=true
                    ;;
                  *)
                    (( age_days >= 14 )) && delete_run=true
                    ;;
                esac
              fi
            fi

            if [[ "$delete_run" == "true" ]]; then
              if gh api -X DELETE "repos/$GH_REPO/actions/runs/$run_id" >/dev/null 2>&1; then
                echo "Deleted stale run $run_id: $workflow_name [$branch] $conclusion"
                deleted=$((deleted + 1))
              else
                echo "GitHub refused deletion for run $run_id"
                kept=$((kept + 1))
              fi
            else
              kept=$((kept + 1))
            fi
          done

          echo "Actions cleanup complete."
