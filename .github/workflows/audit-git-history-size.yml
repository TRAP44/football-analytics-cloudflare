name: Audit Git history size

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-git-history-size.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-git-history-size
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all branches and tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'

      - name: Audit repository object sizes
        shell: bash
        run: |
          set -euo pipefail

          echo "### Git object storage"
          git count-objects -vH

          echo
          echo "### Reachable commit count"
          git rev-list --all --count

          echo
          echo "### Largest reachable blobs"
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '$1=="blob" { size=$3; $1=$2=$3=""; sub(/^ +/, "", $0); print size "\t" $0 }' \
            | sort -nr \
            | head -n 100 \
            | awk 'BEGIN {OFS="\t"} {printf "%.2f MiB\t%s\n", $1/1048576, substr($0,index($0,$2))}'

          echo
          echo "### Blobs >= 5 MiB"
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '$1=="blob" && $3>=5242880 { size=$3; $1=$2=$3=""; sub(/^ +/, "", $0); printf "%.2f MiB\t%s\n", size/1048576, $0 }' \
            | sort -nr || true

          echo
          echo "### Blobs >= 20 MiB"
          git rev-list --objects --all \
            | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' \
            | awk '$1=="blob" && $3>=20971520 { size=$3; $1=$2=$3=""; sub(/^ +/, "", $0); printf "%.2f MiB\t%s\n", size/1048576, $0 }' \
            | sort -nr || true
