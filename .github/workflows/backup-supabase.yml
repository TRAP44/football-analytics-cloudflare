name: Backup Supabase

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backup-supabase.yml"
      - "scripts/verify-supabase-restore.sql"
      - "scripts/apply-supabase-restore-hardening.sql"
      - "docs/SUPABASE_BACKUP_RUNBOOK_RU.md"
      - "test/supabase-backup-workflow.test.js"
  schedule:
    # Weekly while the project is in the current low-volume/free-plan phase.
    # Run off the app's 5-minute/15-minute cron boundaries.
    - cron: "17 2 * * 0"

permissions:
  actions: read
  contents: read

concurrency:
  group: supabase-production-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_PROJECT_REF: "nlmvhkjkpgzzlfavaohk"
      SUPABASE_CLI_VERSION: "2.118.0"
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}

    steps:
      - name: Checkout backup contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Backup preflight
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_DB_URL:-}" ]]; then
            echo "### Supabase backup blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing production environment secret SUPABASE_DB_URL." >> "$GITHUB_STEP_SUMMARY"
            echo "Use the Supabase Session pooler connection string (port 5432); GitHub Actions is IPv4-only." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ -z "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ]]; then
            echo "### Supabase backup blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing production environment secret BACKUP_ENCRYPTION_PASSPHRASE." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "${#BACKUP_ENCRYPTION_PASSPHRASE}" -lt 24 ]]; then
            echo "BACKUP_ENCRYPTION_PASSPHRASE must contain at least 24 characters." >&2
            exit 1
          fi

          echo "::add-mask::$SUPABASE_DB_URL"
          echo "::add-mask::$BACKUP_ENCRYPTION_PASSPHRASE"

          if [[ "$SUPABASE_DB_URL" != postgres://* && "$SUPABASE_DB_URL" != postgresql://* ]]; then
            echo "SUPABASE_DB_URL must be a Postgres connection string." >&2
            exit 1
          fi

          DB_HOST="$(node -e 'const u=new URL(process.env.SUPABASE_DB_URL); process.stdout.write(u.hostname)')"
          DB_PORT="$(node -e 'const u=new URL(process.env.SUPABASE_DB_URL); process.stdout.write(u.port || "")')"
          DB_USER="$(node -e 'const u=new URL(process.env.SUPABASE_DB_URL); process.stdout.write(decodeURIComponent(u.username))')"

          if [[ ! "$DB_HOST" =~ ^[a-z0-9-]+\.pooler\.supabase\.com$ || "$DB_PORT" != "5432" ]]; then
            echo "SUPABASE_DB_URL must use an exact Supavisor Session pooler host on port 5432 for GitHub Actions IPv4 compatibility." >&2
            exit 1
          fi

          if [[ "$DB_USER" != "postgres.$SUPABASE_PROJECT_REF" ]]; then
            echo "SUPABASE_DB_URL username does not target the configured production project ref." >&2
            exit 1
          fi

          docker --version
          openssl version
          npx --yes "supabase@$SUPABASE_CLI_VERSION" --version

          echo "### Supabase backup preflight passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Project ref: $SUPABASE_PROJECT_REF" >> "$GITHUB_STEP_SUMMARY"
          echo "CLI: $SUPABASE_CLI_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact encryption: AES-256-CBC + PBKDF2" >> "$GITHUB_STEP_SUMMARY"

      - name: Create logical backup
        id: dump
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          BACKUP_DIR="$RUNNER_TEMP/supabase-backup"
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR"

          npx --yes "supabase@$SUPABASE_CLI_VERSION" db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f "$BACKUP_DIR/roles.sql" \
            --role-only

          npx --yes "supabase@$SUPABASE_CLI_VERSION" db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f "$BACKUP_DIR/schema.sql"

          npx --yes "supabase@$SUPABASE_CLI_VERSION" db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f "$BACKUP_DIR/data.sql" \
            --use-copy \
            --data-only \
            -x "storage.buckets_vectors" \
            -x "storage.vector_indexes"

          for required in roles.sql schema.sql data.sql; do
            if [[ ! -s "$BACKUP_DIR/$required" ]]; then
              echo "Backup file $required is missing or empty." >&2
              exit 1
            fi
          done

          # Guard against accidentally backing up a different Supabase project.
          grep -q "analysis_cache" "$BACKUP_DIR/schema.sql"
          grep -q "match_reminders" "$BACKUP_DIR/schema.sql"
          grep -q "runtime_controls" "$BACKUP_DIR/schema.sql"

          # Secrets themselves must never be present in backup output.
          if grep -R -F -- "$SUPABASE_DB_URL" "$BACKUP_DIR" >/dev/null 2>&1; then
            echo "Connection secret unexpectedly appeared in backup output." >&2
            exit 1
          fi
          if grep -R -F -- "$BACKUP_ENCRYPTION_PASSPHRASE" "$BACKUP_DIR" >/dev/null 2>&1; then
            echo "Encryption secret unexpectedly appeared in backup output." >&2
            exit 1
          fi

          CREATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          CREATED_COMPACT="$(date -u +'%Y%m%dT%H%M%SZ')"

          cat > "$BACKUP_DIR/manifest.txt" <<EOF
          product=MatchRadar
          project_ref=$SUPABASE_PROJECT_REF
          created_at=$CREATED_AT
          source_sha=$GITHUB_SHA
          workflow_run_id=$GITHUB_RUN_ID
          supabase_cli_version=$SUPABASE_CLI_VERSION
          format=logical_sql_roles_schema_data
          encryption=aes-256-cbc-pbkdf2
          EOF

          (
            cd "$BACKUP_DIR"
            sha256sum roles.sql schema.sql data.sql manifest.txt > SHA256SUMS
          )

          echo "backup_dir=$BACKUP_DIR" >> "$GITHUB_OUTPUT"
          echo "created_compact=$CREATED_COMPACT" >> "$GITHUB_OUTPUT"

      - name: Package, encrypt and verify archive
        id: package
        shell: bash
        env:
          BACKUP_DIR: ${{ steps.dump.outputs.backup_dir }}
          CREATED_COMPACT: ${{ steps.dump.outputs.created_compact }}
        run: |
          set -euo pipefail
          umask 077

          ARCHIVE="$RUNNER_TEMP/matchradar-supabase-$SUPABASE_PROJECT_REF-$CREATED_COMPACT.tar.gz"
          ENCRYPTED="$ARCHIVE.enc"
          ENCRYPTED_CHECKSUM="$ENCRYPTED.sha256"
          VERIFY_ARCHIVE="$RUNNER_TEMP/verify-matchradar-backup.tar.gz"

          tar -C "$BACKUP_DIR" -czf "$ARCHIVE" .
          test -s "$ARCHIVE"

          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in "$ARCHIVE" \
            -out "$ENCRYPTED" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE

          test -s "$ENCRYPTED"
          sha256sum "$ENCRYPTED" > "$ENCRYPTED_CHECKSUM"
          sha256sum -c "$ENCRYPTED_CHECKSUM"

          # Prove the uploaded artifact can be decrypted before deleting plaintext.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in "$ENCRYPTED" \
            -out "$VERIFY_ARCHIVE" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          cmp "$ARCHIVE" "$VERIFY_ARCHIVE"

          rm -f "$VERIFY_ARCHIVE" "$ARCHIVE"
          rm -rf "$BACKUP_DIR"

          echo "encrypted=$ENCRYPTED" >> "$GITHUB_OUTPUT"
          echo "checksum=$ENCRYPTED_CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted private off-site backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-production-backup-${{ github.run_id }}
          path: |
            ${{ steps.package.outputs.encrypted }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Backup summary
        shell: bash
        run: |
          {
            echo "### Supabase logical backup completed"
            echo "- Project ref: $SUPABASE_PROJECT_REF"
            echo "- Contents before encryption: roles.sql + schema.sql + data.sql + manifest + checksums"
            echo "- Storage: encrypted private GitHub Actions artifact"
            echo "- Encryption: AES-256-CBC + PBKDF2 (250000 iterations)"
            echo "- Plaintext archive removed before artifact upload"
            echo "- Retention: 30 days"
            echo "- Automatic cadence: weekly"
            echo "- Run manually before every production migration."
          } >> "$GITHUB_STEP_SUMMARY"


  restore_drill:
    name: Isolated restore drill
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SUPABASE_CLI_VERSION: "2.118.0"
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
    steps:
      - name: Checkout restore contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate restore secret
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BACKUP_ENCRYPTION_PASSPHRASE:-}" ]]; then
            echo "Missing production environment secret BACKUP_ENCRYPTION_PASSPHRASE." >&2
            exit 1
          fi
          if [[ "${#BACKUP_ENCRYPTION_PASSPHRASE}" -lt 24 ]]; then
            echo "BACKUP_ENCRYPTION_PASSPHRASE must contain at least 24 characters." >&2
            exit 1
          fi
          echo "::add-mask::$BACKUP_ENCRYPTION_PASSPHRASE"

      - name: Download exact encrypted backup from this run
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: supabase-production-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/restore-artifact

      - name: Validate downloaded backup artifact
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR="$RUNNER_TEMP/restore-artifact"
          test -n "$(find "$ARTIFACT_DIR" -maxdepth 1 -name '*.tar.gz.enc' -print -quit)"
          test -n "$(find "$ARTIFACT_DIR" -maxdepth 1 -name '*.sha256' -print -quit)"
          echo "ARTIFACT_DIR=$ARTIFACT_DIR" >> "$GITHUB_ENV"

      - name: Decrypt and verify backup package
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ENCRYPTED="$(find "$ARTIFACT_DIR" -maxdepth 1 -name '*.tar.gz.enc' -print -quit)"
          CHECKSUM="$(find "$ARTIFACT_DIR" -maxdepth 1 -name '*.sha256' -print -quit)"
          EXPECTED_HASH="$(awk '{print $1}' "$CHECKSUM")"
          ACTUAL_HASH="$(sha256sum "$ENCRYPTED" | awk '{print $1}')"
          [[ -n "$EXPECTED_HASH" && "$EXPECTED_HASH" == "$ACTUAL_HASH" ]]

          RESTORE_ARCHIVE="$RUNNER_TEMP/matchradar-restore.tar.gz"
          RESTORE_DIR="$RUNNER_TEMP/matchradar-restore"
          rm -rf "$RESTORE_DIR" "$RESTORE_ARCHIVE"
          mkdir -p "$RESTORE_DIR"

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 250000 \
            -in "$ENCRYPTED" \
            -out "$RESTORE_ARCHIVE" \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE

          tar -xzf "$RESTORE_ARCHIVE" -C "$RESTORE_DIR"
          (
            cd "$RESTORE_DIR"
            sha256sum -c SHA256SUMS
          )

          for required in roles.sql schema.sql data.sql manifest.txt; do
            test -s "$RESTORE_DIR/$required"
          done

          SOURCE_SHA="$(sed -n 's/^source_sha=//p' "$RESTORE_DIR/manifest.txt" | head -n 1)"
          BACKUP_CREATED_AT="$(sed -n 's/^created_at=//p' "$RESTORE_DIR/manifest.txt" | head -n 1)"
          BACKUP_RUN_ID="$(sed -n 's/^workflow_run_id=//p' "$RESTORE_DIR/manifest.txt" | head -n 1)"
          [[ "$BACKUP_RUN_ID" == "$GITHUB_RUN_ID" ]]
          [[ "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ -n "$BACKUP_CREATED_AT" ]]

          NOW_EPOCH="$(date -u +%s)"
          BACKUP_EPOCH="$(date -u -d "$BACKUP_CREATED_AT" +%s)"
          BACKUP_AGE_SECONDS="$((NOW_EPOCH - BACKUP_EPOCH))"
          (( BACKUP_AGE_SECONDS >= 0 ))

          echo "RESTORE_DIR=$RESTORE_DIR" >> "$GITHUB_ENV"
          echo "BACKUP_CREATED_AT=$BACKUP_CREATED_AT" >> "$GITHUB_ENV"
          echo "BACKUP_AGE_SECONDS=$BACKUP_AGE_SECONDS" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          rm -f "$RESTORE_ARCHIVE"

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          RESTORE_STARTED_EPOCH="$(date -u +%s)"
          RESTORE_STARTED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LOCAL_PROJECT="$RUNNER_TEMP/supabase-restore-project"
          rm -rf "$LOCAL_PROJECT"
          mkdir -p "$LOCAL_PROJECT"
          cd "$LOCAL_PROJECT"

          npx --yes "supabase@$SUPABASE_CLI_VERSION" init >/dev/null
          npx --yes "supabase@$SUPABASE_CLI_VERSION" start \
            -x studio,imgproxy,edge-runtime,logflare,vector,supavisor \
            >"$RUNNER_TEMP/supabase-restore-start.log" 2>&1

          DB_CONTAINER="$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)"
          [[ -n "$DB_CONTAINER" ]]
          echo "DB_CONTAINER=$DB_CONTAINER" >> "$GITHUB_ENV"
          echo "RESTORE_STARTED_EPOCH=$RESTORE_STARTED_EPOCH" >> "$GITHUB_ENV"
          echo "RESTORE_STARTED_AT=$RESTORE_STARTED_AT" >> "$GITHUB_ENV"

      - name: Restore schema and data into isolated database
        shell: bash
        run: |
          set -euo pipefail
          docker cp "$RESTORE_DIR/schema.sql" "$DB_CONTAINER:/tmp/matchradar-schema.sql"
          docker cp "$RESTORE_DIR/data.sql" "$DB_CONTAINER:/tmp/matchradar-data.sql"
          docker cp "scripts/apply-supabase-restore-hardening.sql" "$DB_CONTAINER:/tmp/apply-supabase-restore-hardening.sql"
          docker cp "scripts/verify-supabase-restore.sql" "$DB_CONTAINER:/tmp/verify-supabase-restore.sql"

          docker exec "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f /tmp/matchradar-schema.sql >/dev/null

          docker exec "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f /tmp/matchradar-data.sql >/dev/null

          # A fresh/local Supabase target can carry broader default ACLs than
          # production. Restore therefore normalizes public-schema privileges
          # to MatchRadar's backend-only contract before acceptance checks.
          docker exec "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f /tmp/apply-supabase-restore-hardening.sql >/dev/null

          docker exec "$DB_CONTAINER" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f /tmp/verify-supabase-restore.sql >/dev/null

      - name: Verify restored key-table row-count parity
        shell: bash
        run: |
          set -euo pipefail

          expected_rows() {
            local table="$1"
            awk -v table="$table" '
              BEGIN { in_copy=0; count=0; found=0 }
              {
                plain = "^COPY public\\." table "[ (]"
                quoted = "^COPY \"public\"\\.\"" table "\"[ (]"
                if ($0 ~ plain || $0 ~ quoted) {
                  in_copy=1
                  found=1
                  next
                }
                if (in_copy && $0 == "\\.") {
                  print count
                  exit
                }
                if (in_copy) count++
              }
              END {
                if (!found) print 0
              }
            ' "$RESTORE_DIR/data.sql"
          }

          for table in users analysis_cache runtime_controls billing_payments user_entitlements; do
            EXPECTED="$(expected_rows "$table" | tail -n 1)"
            ACTUAL="$(docker exec "$DB_CONTAINER" \
              psql -U postgres -d postgres -Atqc "select count(*) from public.$table")"
            [[ "$EXPECTED" =~ ^[0-9]+$ ]]
            [[ "$ACTUAL" =~ ^[0-9]+$ ]]
            if [[ "$EXPECTED" != "$ACTUAL" ]]; then
              echo "Restored row-count parity failed for $table." >&2
              exit 1
            fi
          done

          echo "Key-table data parity verified without printing production row counts."

      - name: Record measured RTO and backup freshness evidence
        shell: bash
        run: |
          set -euo pipefail
          COMPLETED_EPOCH="$(date -u +%s)"
          COMPLETED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          RESTORE_SECONDS="$((COMPLETED_EPOCH - RESTORE_STARTED_EPOCH))"
          EVIDENCE="$RUNNER_TEMP/restore-drill-evidence.json"

          cat > "$EVIDENCE" <<EOF
          {
            "product": "MatchRadar",
            "kind": "supabase_isolated_restore_drill",
            "workflowRunId": "$GITHUB_RUN_ID",
            "sourceSha": "$SOURCE_SHA",
            "backupCreatedAt": "$BACKUP_CREATED_AT",
            "drillStartedAt": "$RESTORE_STARTED_AT",
            "drillCompletedAt": "$COMPLETED_AT",
            "backupAgeSecondsAtDrillStart": $BACKUP_AGE_SECONDS,
            "restoreAndVerificationSeconds": $RESTORE_SECONDS,
            "verifiedTables": [
              "users",
              "analysis_cache",
              "runtime_controls",
              "billing_payments",
              "user_entitlements"
            ],
            "rowCountParityVerified": true,
            "rlsAndPrivilegeChecksVerified": true,
            "productionDatabaseWritten": false
          }
          EOF

          {
            echo "### Supabase isolated restore drill passed"
            echo "- Source SHA: $SOURCE_SHA"
            echo "- Backup created: $BACKUP_CREATED_AT"
            echo "- Observed backup age at drill start: $BACKUP_AGE_SECONDS seconds"
            echo "- Measured isolated restore + verification time: $RESTORE_SECONDS seconds"
            echo "- Key-table row-count parity: verified (counts intentionally not printed)"
            echo "- RLS / anon / authenticated / service_role checks: verified"
            echo "- Production database writes: none"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"

      - name: Upload restore drill evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supabase-restore-drill-evidence-${{ github.run_id }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -d "$RUNNER_TEMP/supabase-restore-project" ]]; then
            cd "$RUNNER_TEMP/supabase-restore-project"
            npx --yes "supabase@$SUPABASE_CLI_VERSION" stop --no-backup >/dev/null 2>&1
          fi
          rm -rf "$RUNNER_TEMP/matchradar-restore" "$RUNNER_TEMP/restore-artifact"
