name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Cloudflare Worker version ID to restore
        required: true
        type: string
      expected_version:
        description: Expected app version after rollback, for example 6.94.0-rc102
        required: true
        type: string
      confirm:
        description: Type ROLLBACK:<expected_version>:<version_id> to confirm the exact rollback target
        required: true
        type: string
      allow_legacy_unverified:
        description: Permit a legacy rollback target without RC116 release identity metadata
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ inputs.confirm == format('ROLLBACK:{0}:{1}', inputs.expected_version, inputs.version_id) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      VERSION_ID: ${{ inputs.version_id }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      ALLOW_LEGACY_UNVERIFIED: ${{ inputs.allow_legacy_unverified }}
      ROLLBACK_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
      ROLLBACK_WORKFLOW_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      WRANGLER_SEND_ERROR_REPORTS: "false"

    steps:
      - name: Checkout verified rollback workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ROLLBACK_WORKFLOW_SHA }}
          fetch-depth: 0

      - name: RC113 verify rollback workflow provenance
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "### Rollback provenance check failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Rollback must be dispatched from main; got ${GITHUB_REF}." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          git fetch --no-tags origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          VERIFIED_SHA="$(git rev-parse HEAD)"
          if [[ "$ROLLBACK_WORKFLOW_SHA" != "$VERIFIED_SHA" ]]; then
            echo "### Rollback provenance check failed" >> "$GITHUB_STEP_SUMMARY"
            echo "Dispatch SHA $ROLLBACK_WORKFLOW_SHA does not match checked-out revision $VERIFIED_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$ROLLBACK_WORKFLOW_SHA" != "$CURRENT_MAIN_SHA" ]]; then
            echo "### Stale rollback workflow blocked" >> "$GITHUB_STEP_SUMMARY"
            echo "Dispatch SHA $ROLLBACK_WORKFLOW_SHA is no longer current main ($CURRENT_MAIN_SHA)." >> "$GITHUB_STEP_SUMMARY"
            echo "Re-dispatch rollback from the current main revision." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "### Rollback workflow revision confirmed" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked-out rollback workflow matches current main: $ROLLBACK_WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Rollback preflight
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Cloudflare credentials are required for rollback." >&2
            exit 1
          fi
          if [[ -z "$ROLLBACK_URL" || "$ROLLBACK_URL" != https://* ]]; then
            echo "CLOUDFLARE_WORKER_URL must be configured as an HTTPS repository/environment variable before rollback." >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+$ ]]; then
            echo "expected_version must look like 6.94.0-rc102." >&2
            exit 1
          fi
          if [[ ! "$VERSION_ID" =~ ^[A-Za-z0-9-]{20,80}$ ]]; then
            echo "version_id format is invalid." >&2
            exit 1
          fi
          echo "### RC114 rollback target confirmation verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Operator confirmation is bound to expected version $EXPECTED_VERSION and version ID $VERSION_ID." >> "$GITHUB_STEP_SUMMARY"

      - name: RC115 verify rollback target exists
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions view "$VERSION_ID" --json > "$RUNNER_TEMP/rollback-version.json"
          echo "### RC115 rollback target preflight passed" >> "$GITHUB_STEP_SUMMARY"
          echo "Cloudflare resolved rollback target version ID $VERSION_ID before any rollback mutation." >> "$GITHUB_STEP_SUMMARY"

      - name: RC117 verify rollback release identity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-rollback-target.js "$RUNNER_TEMP/rollback-version.json" "$EXPECTED_VERSION" "$VERSION_ID" "$ALLOW_LEGACY_UNVERIFIED"
          echo "### RC117 rollback release identity guard passed" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ALLOW_LEGACY_UNVERIFIED" == "true" ]]; then
            echo "Legacy override was explicitly enabled; stamped targets still require an exact release match." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Rollback target metadata matches expected release $EXPECTED_VERSION." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Roll back Worker
        shell: bash
        run: |
          npx wrangler rollback "$VERSION_ID" --yes --message "Manual rollback to $EXPECTED_VERSION from GitHub Actions"

      - name: Verify restored production
        shell: bash
        run: |
          node scripts/rollback-smoke.js "$ROLLBACK_URL" "$EXPECTED_VERSION"
          echo "### Cloudflare rollback verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Restored and verified: $EXPECTED_VERSION" >> "$GITHUB_STEP_SUMMARY"
