name: Legacy Regression Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 0"

permissions:
  contents: read

concurrency:
  group: legacy-regression-audit
  cancel-in-progress: true

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run full historical regression suite
        run: npm test
