name: Configure Settlement Recovery
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Enable or disable only the bounded settlement recovery flag
        type: choice
        options: [enable, disable]
        default: disable
permissions:
  contents: read
concurrency:
  group: settlement-recovery-control
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - name: Checkout exact main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Configure only the settlement flag with transactional audit
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SETTLEMENT_AUTOMATION: ${{ inputs.mode }}
        run: |
          command -v psql >/dev/null
          node scripts/settlement-recovery-control.js
