name: Background Jobs

# Фоновые задачи MatchRadar (напоминания, уведомления, итоги дня, разбор после
# матча, предматчевые прогнозы) вне Cloudflare: на Workers Free cron-запуск
# воркера ограничен 10 мс CPU и обрывается. Тот же обработчик scheduled()
# выполняется здесь в Node 22. Запускает его cron Cloudflare: каждые 5 минут
# воркер вызывает workflow_dispatch (src/github-dispatch-runtime.js), сам задачи
# не выполняет. Расписание ниже — запасное: GitHub срабатывает по нему раз в
# несколько часов. Повторные запуски безопасны: общая блокировка cron-global.
# Ключи — только секреты окружения background-jobs (Settings → Environments),
# доступного лишь ветке main: ветки PR до них не дотягиваются.

on:
  workflow_dispatch:
    inputs:
      settlement_recovery:
        description: 'Разовая сверка старых прогнозов; off сохраняет обычный cron'
        type: choice
        options: ['off', 'preview', 'apply', 'automatic']
        default: 'off'
  schedule:
    # GitHub запускает расписание с задержкой; скрипт сам относит запуск к
    # 5-минутному слоту, а общая блокировка не даёт задачам выполниться дважды.
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: background-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: background-jobs
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_PUBLISHER_BOT_TOKEN: ${{ secrets.TELEGRAM_PUBLISHER_BOT_TOKEN }}
      ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
      BETA_TELEGRAM_IDS: ${{ secrets.BETA_TELEGRAM_IDS }}
      BETA_ACCESS_ENABLED: ${{ secrets.BETA_ACCESS_ENABLED }}
      PREMATCH_PREDICTIONS_ENABLED: ${{ vars.PREMATCH_PREDICTIONS_ENABLED }}
      SETTLEMENT_RECOVERY_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.settlement_recovery != 'off' && inputs.settlement_recovery || '' }}
      LIVE_NOTIFICATIONS_FAST_ENABLED: ${{ vars.LIVE_NOTIFICATIONS_FAST_ENABLED }}
      FAVORITE_SCOREBOARD_ENABLED: ${{ vars.FAVORITE_SCOREBOARD_ENABLED }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
      TAVILY_KEY: ${{ secrets.TAVILY_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install background rendering dependency
        run: npm ci --omit=dev --ignore-scripts

      - name: Run scheduled tasks
        run: node scripts/cron-runner.js

  # The existing Cloudflare dispatch is the reliable five-minute clock.
  # Keep optional video I/O independent of notification leases and Telegram keys.
  watch:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.settlement_recovery != 'preview' && inputs.settlement_recovery != 'apply' && inputs.settlement_recovery != 'automatic'))
    environment: background-jobs
    timeout-minutes: 3
    concurrency:
      group: match-watch-refresh
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Refresh official watch catalogue
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/refresh-match-watch.js
      - name: Save watch refresh result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: match-watch-refresh
          path: load-results/match-watch-refresh.json
          retention-days: 3
          if-no-files-found: error
